name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install the runtimes of the older targets
        # The SDK of global.json builds every target but ships only its own runtime: the ASP.NET Core
        # runtime of each older target framework (read from Directory.Build.props) runs its tests.
        shell: pwsh
        run: |
          $sdkMajor = [int]((dotnet --version).Split('.')[0])
          $frameworks = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.TargetFrameworks
          if (-not $frameworks) { throw 'Directory.Build.props declares no TargetFrameworks.' }
          # The install script is pinned to a commit of dotnet/install-scripts and checked against its SHA-256.
          Invoke-WebRequest https://raw.githubusercontent.com/dotnet/install-scripts/ee83f9c42135205be4e0503bd472b6f99c9b7d51/src/dotnet-install.sh -OutFile dotnet-install.sh
          $expected = '082f7685e156738a1b2e2ed8381a621870d4ce8e8c59278034556f05c186eb2e'
          $actual = (Get-FileHash dotnet-install.sh -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "dotnet-install.sh does not match its pinned SHA-256 ($actual)." }
          foreach ($framework in $frameworks.Split(';')) {
            $channel = $framework -replace '^net', ''
            if ([int]$channel.Split('.')[0] -ge $sdkMajor) { continue }
            bash dotnet-install.sh --runtime aspnetcore --channel $channel --install-dir $env:DOTNET_ROOT
            if ($LASTEXITCODE -ne 0) { throw "Installing the ASP.NET Core $channel runtime failed." }
          }
          dotnet --list-runtimes
      - name: Restore
        run: dotnet restore OmniEurope.Diagnostics.slnx
      - name: Build
        run: dotnet build OmniEurope.Diagnostics.slnx --configuration Release --no-restore
      - name: Tests and coverage (net10.0)
        # global.json runs dotnet test on Microsoft.Testing.Platform: xunit.v3 runs the suite, TrxReport
        # writes the TRX and coverlet.MTP one Cobertura report, restricted to the two published libraries.
        # The gates read one Cobertura report, so coverage comes from the net10.0 run.
        run: >-
          dotnet test --project tests/OmniEurope.Diagnostics.Tests/OmniEurope.Diagnostics.Tests.csproj
          --configuration Release --no-build --no-progress --framework net10.0
          --report-trx --report-trx-filename tests.trx --results-directory artifacts/coverage
          --coverlet --coverlet-output-format cobertura
          --coverlet-include "[OmniEurope.Diagnostics]*" --coverlet-include "[OmniEurope.Diagnostics.Core]*"
      - name: Tests (net11.0)
        run: >-
          dotnet test --project tests/OmniEurope.Diagnostics.Tests/OmniEurope.Diagnostics.Tests.csproj
          --configuration Release --no-build --no-progress --framework net11.0
          --report-trx --report-trx-filename tests.trx --results-directory artifacts/tests-net11
      - name: Verify the test results exist
        # A run that wrote no result file is a failure, whatever its exit code.
        shell: pwsh
        run: |
          foreach ($root in 'artifacts/coverage', 'artifacts/tests-net11') {
            $trx = Get-ChildItem $root -Filter tests.trx -Recurse -File | Select-Object -First 1
            if (-not $trx) { throw "The test run produced no TRX under $root." }
            $counters = ([xml](Get-Content $trx.FullName -Raw)).TestRun.ResultSummary.Counters
            if ([int]$counters.total -eq 0) { throw "The TRX under $root holds no test." }
            "Tests ($root): $($counters.passed) passed of $($counters.total)."
          }
          if (-not (Get-ChildItem artifacts/coverage -Filter '*.cobertura*.xml' -Recurse -File)) { throw 'No Cobertura report.' }
      - name: Coverage floors
        shell: pwsh
        run: ./scripts/coverage-gate.ps1 -CoverageRoot artifacts/coverage
      - name: CRAP gate
        shell: pwsh
        run: ./scripts/crap-gate.ps1 -CoverageRoot artifacts/coverage
      - name: Pack
        run: |
          dotnet pack src/OmniEurope.Diagnostics.Core/OmniEurope.Diagnostics.Core.csproj --configuration Release --no-build --output artifacts/packages
          dotnet pack src/OmniEurope.Diagnostics/OmniEurope.Diagnostics.csproj --configuration Release --no-build --output artifacts/packages
      - name: Package content
        # What a consumer receives: each library, its documentation, the README, the symbols; no stylesheet, no
        # script. Core carries the English texts, references packages only and never the ASP.NET Core shared
        # framework; the ASP.NET Core package references that framework and Core alone.
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $expectations = @(
            @{ Id = 'OmniEurope.Diagnostics.Core'; Satellite = $true; Frameworks = @(); Dependencies = '^Microsoft\.(AspNetCore\.Components\.Web|Extensions\.[A-Za-z.]+)$' },
            @{ Id = 'OmniEurope.Diagnostics'; Satellite = $false; Frameworks = @('Microsoft.AspNetCore.App'); Dependencies = '^OmniEurope\.Diagnostics\.Core$' }
          )
          foreach ($expected in $expectations) {
            $id = $expected.Id
            $package = Get-ChildItem artifacts/packages -Filter "$id.*.nupkg" | Where-Object { $_.Name -match "^$([regex]::Escape($id))\.\d" } | Select-Object -First 1
            $symbols = Get-ChildItem artifacts/packages -Filter "$id.*.snupkg" | Where-Object { $_.Name -match "^$([regex]::Escape($id))\.\d" } | Select-Object -First 1
            if (-not $package -or -not $symbols) { throw "The package $id or its symbol package is missing." }
            $zip = [IO.Compression.ZipFile]::OpenRead($package.FullName)
            try {
              $entries = @($zip.Entries.FullName)
              $required = @('README.md') + @('net10.0', 'net11.0' | ForEach-Object { "lib/$_/$id.dll", "lib/$_/$id.xml" })
              if ($expected.Satellite) { $required += @('net10.0', 'net11.0' | ForEach-Object { "lib/$_/en/$id.resources.dll" }) }
              foreach ($file in $required) {
                if ($entries -notcontains $file) { throw "Missing from ${id}: $file" }
              }
              $styled = @($entries | Where-Object { $_ -match '\.(css|js|mjs)$' })
              if ($styled) { throw "$id must ship no stylesheet or script: $($styled -join ', ')" }
              $reader = [IO.StreamReader]::new(($zip.Entries | Where-Object FullName -eq "$id.nuspec").Open())
              try { [xml]$nuspec = $reader.ReadToEnd() } finally { $reader.Dispose() }
            } finally { $zip.Dispose() }
            $metadata = $nuspec.package.metadata
            $frameworks = @($metadata.frameworkReferences.group | ForEach-Object { $_.frameworkReference } | Where-Object { $_ } | ForEach-Object { $_.name } | Sort-Object -Unique)
            if (($frameworks -join ',') -ne ($expected.Frameworks -join ',')) { throw "$id framework references: $($frameworks -join ', ')" }
            $dependencies = @($metadata.dependencies.group | ForEach-Object { $_.dependency } | Where-Object { $_ } | ForEach-Object { $_.id } | Sort-Object -Unique)
            if (-not $dependencies) { throw "$id declares no dependency." }
            $unexpected = @($dependencies | Where-Object { $_ -notmatch $expected.Dependencies })
            if ($unexpected) { throw "Unexpected dependencies of ${id}: $($unexpected -join ', ')" }
            "Package $($metadata.id) $($metadata.version) verified."
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-package
          path: artifacts/packages
          if-no-files-found: error
